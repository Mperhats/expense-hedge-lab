[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "expense-hedge-lab"
version = "0.1.0"
description = "Historical-index stress test of personal expense hedges; synthetic contract economics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
expense-hedge = "expense_hedge.simulation:main"
[tool.setuptools.packages.find]
where = ["src"]
